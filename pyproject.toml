[project]
name = "message-transfer-bot"
version = "0.1.0"
description = "Message synchronization between Discord channels and other platforms"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1,<3",
    "aiosqlite>=0.21,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/message_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
